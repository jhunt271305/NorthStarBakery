<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star Bakery | Contact</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="media/bakery-logo.png" alt="North Star Bakery logo" width="25%">
    <h1>Contact & Pre-Orders</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Behind the Scenes</h2>
    <video src="media/bakery-behind-scenes.mp4" controls width="720" height="480" poster="media/bakery-signature-loaf.jpg" preload="metadata">
      Your browser does not support the video tag. Please visit our bakery to see the baking process in person.
    </video>

    <h2>Inquiry & Pre-Order Form</h2>
    <form action="/contact" method="post">
      <fieldset>
        <legend>Contact Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required minlength="2" maxlength="50"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
      </fieldset>

      <fieldset>
        <legend>Order Details</legend>
        <label for="pickup">Pickup Date:</label>
        <input type="date" id="pickup" name="pickup" required><br><br>

        <label for="request">Request Type:</label>
        <select id="request" name="request" required>
          <option value="">Choose one</option>
          <option value="preorder">Pre-order</option>
          <option value="question">General Question</option>
        </select><br><br>

        <label for="details">Item Details:</label>
        <textarea id="details" name="details" required minlength="10"></textarea><br><br>

        <label for="allergy">Allergy Notes (optional):</label>
        <textarea id="allergy" name="allergy"></textarea><br><br>
      </fieldset>

      <button type="submit">Submit Request</button>
    </form>
  </main>

  <footer>
    <p>123 Main Street, Atlanta, GA | (770) 555-1212</p>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>
</body>
</html>
